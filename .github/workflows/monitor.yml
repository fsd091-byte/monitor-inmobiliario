name: Monitor Inmobiliario Diario

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Permiso indispensable para que la acción pueda escribir en el repo

jobs:
  ejecutar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests apify-client

      - name: Ejecutar Monitor Inmobiliario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py

      - name: Comprobar si la BD existe realmente antes del commit
        run: |
          echo "Buscando ficheros .db en el workspace:"
          find . -name "*.db"
          ls -la

      - name: Forzar seguimiento de la base de datos en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inmuebles.db
          git status

      - name: Guardar base de datos actualizada en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar base de datos de pisos vistos [skip ci]"
          file_pattern: "inmuebles.db"
          skip_ci: true
