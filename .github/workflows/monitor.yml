name: Monitor Inmobiliario diario

on:
  schedule:
    # Se ejecuta a las 09:00 y a las 18:00 (UTC) de lunes a viernes
    - cron: '0 9,18 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub cuando quieras

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests apify-client

      - name: Ejecutar Monitor Inmobiliario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python main.py